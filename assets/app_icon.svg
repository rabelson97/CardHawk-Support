<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <!-- Squircle Background -->
  <path d="M128,256 Q128,128 256,128 L768,128 Q896,128 896,256 L896,768 Q896,896 768,896 L256,896 Q128,896 128,768 Z" fill="#060913" stroke="#00d9ff" stroke-width="12"/>
  
  <!-- Main content group rotated -18 degrees -->
  <g transform="translate(512, 520) rotate(-18)">
    
    <!-- Card plate drop shadow -->
    <path d="M-236,66 Q-236,150 -148,150 L148,150 Q236,150 236,62 L236,-204 Q236,-292 148,-292 L-148,-292 Q-236,-292 -236,-204 Z" fill="rgba(0,0,0,0.45)"/>
    
    <!-- Card plate fill -->
    <path d="M-148,-292 L148,-292 Q236,-292 236,-204 L236,196 Q236,292 148,292 L-148,292 Q-236,292 -236,196 L-236,-204 Q-236,-292 -148,-292 Z" fill="#061f2d"/>
    
    <!-- Outer stroke (30px) -->
    <path d="M-148,-292 L148,-292 Q236,-292 236,-204 L236,196 Q236,292 148,292 L-148,292 Q-236,292 -236,196 L-236,-204 Q-236,-292 -148,-292 Z" fill="none" stroke="#00d9ff" stroke-width="30"/>
    
    <!-- Inner border -->
    <path d="M-140,-250 L140,-250 Q196,-250 196,-194 L196,194 Q196,250 140,250 L-140,250 Q-196,250 -196,194 L-196,-194 Q-196,-250 -140,-250 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="10"/>

    <!-- Hawk Group -->
    <g transform="translate(-40, -60) scale(1.5)">
      <!-- Wing -->
      <path d="M40,-40 C20,-120 -10,-200 -30,-240 L0,-160 L-20,-150 L10,-100 L-5,-95 L35,-45 Z" fill="#ffffff" opacity="0.75"/>
      
      <!-- Body -->
      <path d="M60,-30 C80,-38 100,-32 110,-25 L120,-18 C135,-5 145,8 142,22 L132,12 L110,12 C95,28 70,40 40,45 C10,50 -30,60 -70,45 L-120,80 L-105,50 L-150,45 L-115,25 L-140,0 L-80,15 C-50,10 -20,-10 0,-30 L-40,-60 L-15,-65 L-60,-120 L-25,-115 L-80,-200 C-10,-170 20,-90 40,-40 C45,-35 50,-32 60,-30 Z" fill="#00d9ff"/>
      
      <!-- Eye -->
      <g transform="translate(108, -13) rotate(30)">
        <circle cx="0" cy="0" r="3.5" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
